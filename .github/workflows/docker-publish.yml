name: Docker publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # secrets ist in `if:` nicht erlaubt – hier auf einen env-Wert abbilden.
      HAS_HUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD != '' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "::error::Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN müssen im Repo gesetzt sein (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/fivem-scanguard
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Aktualisiert die Overview-Seite auf Docker Hub. Braucht das ECHTE
      # Account-Passwort (Secret DOCKERHUB_PASSWORD) – ein Personal Access Token
      # wird von der Hub-Management-API mit 403 abgelehnt. Ohne das Secret wird
      # der Schritt übersprungen; die Beschreibung dann einmalig von Hand pflegen.
      - name: Sync Docker Hub description
        if: env.HAS_HUB_PASSWORD == 'true'
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/fivem-scanguard
          readme-filepath: ./docs/DOCKERHUB.md
          short-description: "Selbst gehosteter Malware-Scanner für FiveM-Ressourcen (Dashboard, API, Discord-Alerts)"
